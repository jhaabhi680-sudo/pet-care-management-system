    function getStorage(key, fallback) {
      try {
        const val = localStorage.getItem('petcare_' + key);
        return val ? JSON.parse(val) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function setStorage(key, val) {
      try {
        localStorage.setItem('petcare_' + key, JSON.stringify(val));
      } catch (e) {}
    }

    // Mock API request dispatcher for static/offline hosting
    function handleMockRequest(endpoint, method, body, token) {
      let users = getStorage('users', INITIAL_USERS);
      let pets = getStorage('pets', INITIAL_PETS);
      let appointments = getStorage('appointments', INITIAL_APPOINTMENTS);
      let records = getStorage('records', INITIAL_RECORDS);
      let services = getStorage('services', INITIAL_SERVICES);

      let currentUser = null;
      if (token) {
        currentUser = users.find(u => u.token === token) || null;
      }
      if (!currentUser) {
        try {
          currentUser = JSON.parse(localStorage.getItem('petCareUser') || 'null');
        } catch(e) {}
      }

      // 1. AUTH: LOGIN
      if (endpoint === '/auth/login' && method === 'POST') {
        const { email, password } = body || {};
        let found = users.find(u => u.email.toLowerCase() === (email || '').toLowerCase().trim());
        if (!found) {
          const role = (email && (email.includes('admin') || email.includes('vet') || email.includes('dr.'))) ? 'veterinarian' : 'owner';
          found = {
            _id: 'usr_' + Date.now(),
            name: (email ? email.split('@')[0] : 'Demo User').replace('.', ' ').toUpperCase(),
            email: email || 'user@example.com',
            phone: '+91 98765 00000',
            password: password || 'password123',
            role: role,
            token: 'mock_token_' + Date.now(),
          };
          users.push(found);
          setStorage('users', users);
        }
        return {
          _id: found._id,
          name: found.name,
          email: found.email,
          phone: found.phone,
          role: found.role,
          token: found.token || 'mock_token_' + found._id,
        };
      }

      // 2. AUTH: REGISTER
      if (endpoint === '/auth/register' && method === 'POST') {
        const { name, email, phone, role } = body || {};
        const newUser = {
          _id: 'usr_' + Date.now(),
          name: name || 'Demo User',
          email: email || `user_${Date.now()}@example.com`,
          phone: phone || '+91 99999 99999',
          role: role || 'owner',
          token: 'mock_token_' + Date.now(),
        };
        users.push(newUser);
        setStorage('users', users);
        return newUser;
      }

      // 3. PETS: GET
      if (endpoint === '/pets' && method === 'GET') {
        if (currentUser && currentUser.role === 'owner') {
          const ownerPets = pets.filter(p => p.owner && (p.owner._id === currentUser._id || p.owner.email === currentUser.email));
          return ownerPets.length > 0 ? ownerPets : pets;
        }
        return pets;
      }

      // 4. PETS: POST (Add Pet)
      if (endpoint === '/pets' && method === 'POST') {
        const newPet = {
          ...body,
          _id: 'pet_' + Date.now(),
          owner: currentUser ? { _id: currentUser._id, name: currentUser.name, phone: currentUser.phone, email: currentUser.email } : { name: 'Rahul Sharma', phone: '+91 98112 23344' },
          createdAt: new Date().toISOString(),
        };
        pets.unshift(newPet);
        setStorage('pets', pets);
        return newPet;
      }

      // 5. PETS: DELETE
      if (endpoint.startsWith('/pets/') && method === 'DELETE') {
        const id = endpoint.split('/pets/')[1];
        pets = pets.filter(p => p._id !== id);
        setStorage('pets', pets);
        return { message: 'Pet removed successfully' };
      }

      // 6. APPOINTMENTS: GET
      if (endpoint === '/appointments' && method === 'GET') {
        if (currentUser && currentUser.role === 'owner') {
          const userAppts = appointments.filter(a => a.owner && (a.owner._id === currentUser._id || a.owner.email === currentUser.email));
          return userAppts.length > 0 ? userAppts : appointments;
        }
        return appointments;
      }

      // 7. APPOINTMENTS: POST (Book Appointment)
      if (endpoint === '/appointments' && method === 'POST') {
        const petObj = pets.find(p => p._id === body.pet) || pets[0];
        const newApt = {
          _id: 'apt_' + Date.now(),
          pet: petObj ? { _id: petObj._id, name: petObj.name, species: petObj.species, breed: petObj.breed, owner: petObj.owner } : { name: 'My Pet' },
          owner: petObj ? petObj.owner : (currentUser || { name: 'Pet Owner' }),
          service: body.service || 'General Health Checkup',
          appointmentDate: body.appointmentDate || new Date().toISOString().split('T')[0],
          appointmentTime: body.appointmentTime || '10:00 AM',
          reason: body.reason || 'Routine Visit',
          notes: body.notes || '',
          status: 'Pending',
          createdAt: new Date().toISOString(),
        };
        appointments.unshift(newApt);
        setStorage('appointments', appointments);
        return newApt;
      }

      // 8. APPOINTMENTS: PUT (Update Status)
      if (endpoint.startsWith('/appointments/') && method === 'PUT') {
        const id = endpoint.split('/appointments/')[1];
        const aptIndex = appointments.findIndex(a => a._id === id);
        if (aptIndex !== -1) {
          appointments[aptIndex] = { ...appointments[aptIndex], ...body };
          setStorage('appointments', appointments);
          return appointments[aptIndex];
        }
        return { message: 'Appointment updated' };
      }

      // 9. MEDICAL RECORDS: GET
      if (endpoint === '/medical-records' && method === 'GET') {
        return records;
      }

      // 10. MEDICAL RECORDS: POST
      if (endpoint === '/medical-records' && method === 'POST') {
        const petObj = pets.find(p => p._id === body.pet) || pets[0];
        const newRecord = {
          _id: 'rec_' + Date.now(),
          pet: petObj ? { _id: petObj._id, name: petObj.name, species: petObj.species, breed: petObj.breed } : { name: 'Pet Patient' },

          diagnosis: body.diagnosis,
          symptoms: body.symptoms || '',
          treatment: body.treatment || '',
          prescription: body.prescription || '',
          vaccination: body.vaccination || '',
          notes: body.notes || '',
          createdAt: new Date().toISOString(),
        };
        records.unshift(newRecord);
        setStorage('records', records);
        return newRecord;
      }

      // 11. SERVICES: GET
      if (endpoint === '/services' && method === 'GET') {
        return services;
      }

      return { status: 'OK' };
    }

    // Helper for API calls with automatic static host & offline fallback
    async function apiRequest(endpoint, method = 'GET', body = null, token = null) {
      const isGitHubPages = window.location.hostname.includes('github.io');
      const customBackendUrl = localStorage.getItem('petCareBackendUrl') || '';

      // If running on local server or custom backend URL configured, attempt real API request
      if (!isGitHubPages || customBackendUrl) {
        try {
          const baseUrl = customBackendUrl || '';
          const headers = { 'Content-Type': 'application/json' };
          if (token) headers['Authorization'] = `Bearer ${token}`;
          const config = { method, headers };
          if (body) config.body = JSON.stringify(body);

          const res = await fetch(baseUrl + '/api' + endpoint, config);
          const contentType = res.headers.get('content-type') || '';

          if (contentType.includes('application/json')) {
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || 'API request failed');
            return data;
          }
          console.warn('Backend responded with non-JSON response; seamlessly falling back to client storage.');
        } catch (err) {
          if (!err.message.includes('JSON') && !err.message.includes('Failed to fetch') && !err.message.includes('NetworkError')) {
            throw err;
          }
          console.warn('Network call failed, switching to client storage:', err);
        }
      }

      // Seamless fallback to client-side MockDB for GitHub Pages static preview
      return handleMockRequest(endpoint, method, body, token);
    }

                      <div>
                        <span className="badge bg-warning text-dark text-uppercase fw-bold">Official Pet Passport</span>
                        <h4 className="fw-bold mt-2 mb-0">{passportPet.name}</h4>
                        <small className="opacity-75">{passportPet.breed} • {passportPet.species}</small>
                      </div>
                      <img src={passportPet.image} alt={passportPet.name} className="rounded-circle border border-2 border-white shadow" style={{ width: '75px', height: '75px', objectFit: 'cover' }} />
                    </div>

                    <div className="row g-2 small border-top border-white border-opacity-25 pt-3 my-2">
                      <div className="col-6"><strong>Microchip ID:</strong><div className="opacity-75">{passportPet.microchipId || '985141002348912'}</div></div>
                      <div className="col-6"><strong>Date of Birth:</strong><div className="opacity-75">{passportPet.dateOfBirth || '2023-04-12'}</div></div>
                      <div className="col-6"><strong>Age & Weight:</strong><div className="opacity-75">{passportPet.age} yrs • {passportPet.weight} kg</div></div>
                      <div className="col-6"><strong>Color:</strong><div className="opacity-75">{passportPet.color || 'Standard'}</div></div>
                    </div>

                    <div className="mt-3 p-2 bg-white bg-opacity-10 rounded-3 d-flex justify-content-between align-items-center">
                      <div>
                        <small className="d-block opacity-75">Anti-Rabies / DHPPi Status</small>
                        <strong>{passportPet.vaccinationStatus}</strong>
                      </div>
                      <span className="badge bg-success">Valid until {passportPet.vaccineExpiry || '2027-04-12'}</span>
                    </div>

                    <div className="mt-3 text-center opacity-50 small">
                      <i className="bi bi-qr-code me-1"></i> Scan to verify in PetCare National Registry
                    </div>
                  </div>
                  <div className="modal-footer bg-light">
                    <button className="btn btn-outline-secondary btn-sm" onClick={() => setPassportPet(null)}>Close</button>
                    <button className="btn btn-teal btn-sm" onClick={() => window.print()}>
                      <i className="bi bi-printer me-1"></i> Print Passport
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* PRESCRIPTION SLIP MODAL */}
          {prescriptionRecord && (
            <div className="modal show fade d-block" style={{ backgroundColor: 'rgba(0,0,0,0.6)', backdropFilter: 'blur(4px)' }}>
              <div className="modal-dialog modal-dialog-centered modal-lg">
                <div className="modal-content border-0 rounded-4 p-3">
                  <div className="rx-sheet">
                    <div className="rx-header d-flex justify-content-between align-items-center">
                      <div>
                        <h4 className="fw-bold mb-0 text-teal" style={{ color: '#0d9488' }}>PetCare Advanced Veterinary Hospital</h4>
                        <small className="text-muted">123 Animal Wellness Lane, Pune, MH • Tel: +91 98765 43210</small>
                      </div>
                      <div className="text-end">
                        <span className="badge bg-dark text-uppercase">Official Rx Slip</span>
                        <div className="small text-muted mt-1">Date: {prescriptionRecord.visitDate}</div>
                      </div>
                    </div>

                    <div className="row g-2 mb-3 small bg-light p-3 rounded-3">
                      <div className="col-md-4"><strong>Patient:</strong> {prescriptionRecord.pet?.name} ({prescriptionRecord.pet?.breed})</div>
                      <div className="col-md-4"><strong>Attending Vet:</strong> Dr. {prescriptionRecord.veterinarian?.name || 'Aditi Sharma'}</div>
                      <div className="col-md-4"><strong>Clinical Diagnosis:</strong> <span className="text-danger fw-bold">{prescriptionRecord.diagnosis}</span></div>
                    </div>

                    <div className="mb-3 small">
                      <strong>Symptoms Observed:</strong>
                      <p className="mb-2 text-muted">{prescriptionRecord.symptoms || 'General wellness evaluation'}</p>
                      <strong>Procedure Administered:</strong>
                      <p className="mb-2 text-muted">{prescriptionRecord.treatment}</p>
                    </div>

                    <div className="border border-success rounded-3 p-3 mb-3 bg-success-subtle">
                      <h6 className="fw-bold text-success mb-2"><i className="bi bi-prescription2 me-1"></i> Prescribed Medication Schedule (Rx)</h6>
                      <p className="mb-0 fw-semibold">{prescriptionRecord.prescription || 'No oral medication prescribed.'}</p>
                    </div>

                    {prescriptionRecord.notes && (
                      <small className="text-muted fst-italic d-block mb-3">
                        * Doctor's Dietary & Care Advice: {prescriptionRecord.notes}
                      </small>
                    )}

                    <div className="d-flex justify-content-between align-items-end pt-3 border-top">
                      <div className="small text-muted">
                        Digitally verified & logged into PetCare Electronic Medical Records (EMR).
                      </div>
                      <div className="text-center">
                        <div className="fw-bold border-bottom pb-1" style={{ width: '160px' }}>Dr. Aditi Sharma</div>
                        <small className="text-muted">Licensed Veterinary Surgeon</small>
                      </div>
                    </div>
                  </div>

                  <div className="modal-footer border-0">
                    <button className="btn btn-secondary btn-sm" onClick={() => setPrescriptionRecord(null)}>Close</button>
                    <button className="btn btn-teal btn-sm" onClick={() => window.print()}>
                      <i className="bi bi-printer me-1"></i> Print Prescription
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* DOCTOR CREATE CLINICAL RECORD MODAL */}
          {showAddRecordModal && (
            <div className="modal show fade d-block" style={{ backgroundColor: 'rgba(0,0,0,0.6)' }}>
              <div className="modal-dialog modal-dialog-centered modal-lg">
                <div className="modal-content border-0 rounded-4 p-3">
                  <div className="modal-header border-0 pb-0">
                    <h5 className="fw-bold">Generate Clinical Medical Record 🩺</h5>
                    <button className="btn-close" onClick={() => setShowAddRecordModal(false)}></button>
                  </div>
                  <form onSubmit={handleSaveRecord}>
                    <div className="modal-body">
                      <div className="row g-3">
                        <div className="col-md-6">
                          <label className="form-label small fw-bold">Select Pet Patient</label>
                          <select className="form-select" required value={medForm.pet} onChange={e => setMedForm({ ...medForm, pet: e.target.value })}>
                            {pets.map(p => <option key={p._id} value={p._id}>{p.name} ({p.species} • {p.breed})</option>)}
                          </select>
                        </div>
                        <div className="col-md-6">
                          <label className="form-label small fw-bold">Diagnosis</label>
                          <input type="text" className="form-control" required placeholder="e.g. Parvovirus, Food Allergy" value={medForm.diagnosis} onChange={e => setMedForm({ ...medForm, diagnosis: e.target.value })} />
                        </div>
                        <div className="col-12">
                          <label className="form-label small fw-bold">Symptoms Observed</label>
                          <input type="text" className="form-control" placeholder="e.g. Vomiting, ear scratching" value={medForm.symptoms} onChange={e => setMedForm({ ...medForm, symptoms: e.target.value })} />
                        </div>
                        <div className="col-12">
                          <label className="form-label small fw-bold">Treatment Given in Hospital</label>
                          <input type="text" className="form-control" required placeholder="e.g. Cleaned wound, saline fluid therapy" value={medForm.treatment} onChange={e => setMedForm({ ...medForm, treatment: e.target.value })} />
                        </div>
                        <div className="col-12">
                          <label className="form-label small fw-bold text-success">Prescription (Rx) & Dosage</label>
                          <textarea className="form-control" rows="2" placeholder="e.g. Amoxicillin 250mg 1 tab twice daily for 5 days" value={medForm.prescription} onChange={e => setMedForm({ ...medForm, prescription: e.target.value })}></textarea>
                        </div>
                        <div className="col-12">
                          <label className="form-label small fw-bold">Doctor's Care Advice</label>
                          <input type="text" className="form-control" placeholder="e.g. Follow-up after 7 days" value={medForm.notes} onChange={e => setMedForm({ ...medForm, notes: e.target.value })} />
                        </div>
                      </div>
                    </div>
                    <div className="modal-footer border-0">
                      <button type="button" className="btn btn-secondary btn-sm" onClick={() => setShowAddRecordModal(false)}>Cancel</button>
                      <button type="submit" className="btn btn-teal btn-sm">Issue Medical Record</button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          )}

          {/* 24/7 SOS MODAL */}
          {showSosModal && (
            <div className="modal show fade d-block" style={{ backgroundColor: 'rgba(0,0,0,0.6)' }}>
              <div className="modal-dialog modal-dialog-centered">
                <div className="modal-content border-0 rounded-4 text-center p-4">
                  <span className="display-4 text-danger mb-2"><i className="bi bi-shield-exclamation"></i></span>
                  <h4 className="fw-bold">24/7 Veterinary Emergency SOS</h4>
                  <p className="text-muted small">Our trauma and acute surgical unit is on call 24 hours a day, 7 days a week.</p>
                  
                  <div className="p-3 bg-danger-subtle text-danger rounded-3 fw-bold fs-5 mb-3">
                    <i className="bi bi-telephone-fill me-2"></i> +91 98765 43210
                  </div>

                  <p className="small text-muted mb-4">
                    If your pet has suffered trauma, ingested toxic substances, or is having difficulty breathing, bring them directly to:
                    <br /><strong>123 Animal Wellness Lane, Pune, MH</strong>.
                  </p>

                  <button className="btn btn-secondary" onClick={() => setShowSosModal(false)}>Dismiss</button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer>
            <div className="container text-center small">
              <p className="mb-1 text-white fw-bold">🐾 PetCare Advanced Management System — Web Lab Project (Course Code: 2345117)</p>
              <p className="mb-0 text-muted">MERN Stack (MongoDB, Express, React, Node.js) with Bootstrap 5.3 & Aesthetic Medical UX.</p>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
